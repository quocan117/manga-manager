spring.application.name=backend

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=mangadb;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

jwt.secret=${JWT_SECRET:manga-manager-development-jwt-secret-change-in-production-2026}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

server.error.include-message=always

manga.upload.page-image-root=./uploads/pages

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true